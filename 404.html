<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面走丢了 · 王孙阳</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#060a14">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230b1120'/%3E%3Ctext x='32' y='45' font-size='34' font-weight='700' font-family='sans-serif' fill='%235eead4' text-anchor='middle'%3E%E7%8E%8B%3C/text%3E%3C/svg%3E">

<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
    document.documentElement.setAttribute('data-theme', saved || (prefersLight ? 'light' : 'dark'));
  })();
</script>

<style>
  :root{
    --bg:#060a14;
    --text:#e8eef9;
    --text-2:#9aa8c0;
    --text-3:#6b7a94;
    --accent:#5eead4;
    --accent-2:#8b7cf6;
    --accent-grad:linear-gradient(120deg,#5eead4,#7ef0dc);
    --accent-glow:rgba(94,234,212,.55);
    --on-accent:#04211c;
    --line:rgba(148,163,184,.18);
    --subtle:rgba(255,255,255,.04);
    --glow-1:rgba(94,234,212,.13);
    --glow-2:rgba(139,124,246,.14);
  }
  :root[data-theme="light"]{
    --bg:#f6f7fb;
    --text:#0f172a;
    --text-2:#4a5878;
    --text-3:#77839a;
    --accent:#0e9887;
    --accent-2:#6b5cf0;
    --accent-grad:linear-gradient(120deg,#0e9887,#16b3a0);
    --accent-glow:rgba(14,152,135,.40);
    --on-accent:#ffffff;
    --line:rgba(15,23,42,.12);
    --subtle:rgba(15,23,42,.035);
    --glow-1:rgba(14,152,135,.10);
    --glow-2:rgba(107,92,240,.10);
  }

  *{margin:0;padding:0;box-sizing:border-box}

  body{
    min-height:100vh;min-height:100svh;
    display:grid;place-items:center;
    padding:32px;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","HarmonyOS Sans SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:16px;line-height:1.7;
    -webkit-font-smoothing:antialiased;
    text-align:center;
    transition:background .35s ease,color .35s ease;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(600px 500px at 50% -10%,var(--glow-1),transparent 62%),
      radial-gradient(500px 420px at 50% 110%,var(--glow-2),transparent 62%);
    transition:background .35s ease;
  }

  main{position:relative;z-index:1;max-width:520px}

  .code{
    font-size:clamp(80px,18vw,132px);
    font-weight:800;line-height:1;letter-spacing:-.04em;
    background:linear-gradient(120deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:18px;
    font-variant-numeric:tabular-nums;
  }

  h1{font-size:clamp(20px,4vw,26px);font-weight:700;margin-bottom:12px;letter-spacing:-.01em}
  p{color:var(--text-2);font-size:15px;margin-bottom:34px}

  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

  a{
    display:inline-flex;align-items:center;gap:8px;
    padding:13px 26px;border-radius:999px;
    text-decoration:none;font-weight:700;font-size:15px;
    border:1px solid transparent;
    transition:transform .25s cubic-bezier(.22,.61,.36,1),
               background .25s ease,border-color .25s ease,box-shadow .25s ease;
  }
  a.primary{
    background:var(--accent-grad);
    color:var(--on-accent);
    box-shadow:0 14px 34px -14px var(--accent-glow);
  }
  a.primary:hover{transform:translateY(-2px)}
  a.ghost{
    color:var(--text);
    background:var(--subtle);
    border-color:var(--line);
    font-weight:600;
  }
  a.ghost:hover{transform:translateY(-2px);border-color:var(--accent)}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  footer{
    position:relative;z-index:1;
    margin-top:44px;
    font-size:13px;color:var(--text-3);
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important}
  }
  @media (max-width:420px){
    .btns{flex-direction:column}
    a{justify-content:center}
  }
</style>
</head>

<body>
  <main>
    <div class="code">404</div>
    <h1>这一页走丢了</h1>
    <p>你找的地址不存在，或者内容已经搬走了。</p>
    <div class="btns">
      <a class="primary" href="/index.html">回到首页 <span aria-hidden="true">→</span></a>
      <a class="ghost" href="/blog.html">看看笔记</a>
    </div>
    <footer>王孙阳 · 个人主页</footer>
  </main>
</body>
</html>
